name: Documentation QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-quality:
    name: Publication quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run publication safety and link checks
        run: python3 scripts/validate_publication.py

